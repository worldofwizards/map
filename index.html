<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桿道夫《魔法公會地圖》探索試煉</title>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-bright: #fbbf24;
            --gold-glow: #ffd700;
            --purple-dark: #120524;
            --purple-border: #7e22ce;
            --purple-glow: #c084fc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background-color: var(--purple-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(147, 51, 234, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, #090214 0%, #17072e 50%, #090214 100%);
            color: #f3e8ff;
            margin: 0;
            padding: 8px 10px 24px;
            min-height: 100vh;
        }

        .map-wrapper {
            max-width: 440px;
            margin: auto;
            position: relative;
        }

        /* 頂部標題 */
        .title-header {
            text-align: center;
            padding: 4px 0 6px;
            position: relative;
        }
        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 21px;
            font-weight: 900;
            color: var(--gold-glow);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.8), 0 0 20px rgba(168, 85, 247, 0.8);
            margin: 0;
        }
        .sub-title {
            font-size: 11px;
            color: #d8b4fe;
            margin-top: 2px;
            letter-spacing: 2px;
        }

        /* 票券狀態列 */
        .active-code-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(45, 12, 77, 0.85);
            border: 1px solid #a855f7;
            border-radius: 8px;
            padding: 5px 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .code-tag {
            color: #ffd700;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .btn-switch-code {
            background: linear-gradient(90deg, #7e22ce, #9333ea);
            border: 1px solid #ffd700;
            color: #ffffff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 進度條 */
        .progress-bar {
            background: rgba(35, 11, 65, 0.9);
            border: 1px solid var(--purple-border);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 10px;
            text-align: center;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            transition: 0.3s;
        }
        .progress-bar.reward-ready {
            background: linear-gradient(90deg, rgba(88, 28, 135, 0.95), rgba(180, 83, 9, 0.95));
            border-color: #ffd700;
            box-shadow: 0 0 18px rgba(251, 191, 36, 0.6);
            cursor: pointer;
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(251, 191, 36, 0.9); }
        }
        .progress-text {
            color: var(--gold-glow);
            font-size: 14px;
            font-weight: 900;
        }
        .progress-sub {
            font-size: 11px;
            color: #c084fc;
            margin-top: 2px;
        }

        /* 📜 羊皮紙卷軸畫布（優化為 375px 高度，適應手機單頁呈現） 📜 */
        .scroll-map-container {
            position: relative;
            width: 100%;
            height: 375px;
            margin-bottom: 12px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.8));
        }

        .scroll-svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 據點點位 */
        .map-node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .map-node:active, .map-node.active {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .node-pin {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: radial-gradient(circle, #2d0b4e 0%, #0c0217 100%);
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.95), 0 3px 8px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 900;
            color: #ffd700;
            transition: 0.3s;
        }
        .map-node.stamped .node-pin {
            background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
            border-color: #4ade80;
            color: #4ade80;
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.95);
        }

        .node-label {
            background: rgba(18, 5, 34, 0.94);
            color: #fef08a;
            border: 1px solid #eab308;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 10.5px;
            font-weight: 900;
            margin-top: 3px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .map-node.stamped .node-label {
            border-color: #4ade80;
            color: #86efac;
        }

        /* 據點詳細資訊卡 */
        .detail-card {
            background: #170928;
            border: 2px solid var(--purple-border);
            border-radius: 14px;
            padding: 14px 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7), 0 0 15px rgba(147, 51, 234, 0.4);
            position: relative;
        }
        .detail-name {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 8px 0;
            text-align: center;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.7);
        }
        .detail-discount {
            background: rgba(59, 7, 100, 0.6);
            border-left: 4px solid var(--gold-bright);
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 13.5px;
            color: #fef08a;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .detail-address {
            font-size: 11.5px;
            color: #cbd5e1;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .btn-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: linear-gradient(90deg, #4c1d95, #6d28d9);
            color: #fef08a;
            text-decoration: none;
            padding: 9px 0;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 900;
            border: 1px solid #a855f7;
            box-shadow: 0 3px 10px rgba(126, 34, 206, 0.4);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .verify-group {
            display: flex;
            gap: 6px;
        }
        .pin-input {
            flex: 1;
            padding: 9px;
            background: #0d0419;
            border: 1px solid var(--purple-border);
            border-radius: 6px;
            color: #ffd700;
            font-size: 15px;
            text-align: center;
            letter-spacing: 3px;
        }
        .btn-verify {
            flex: 1;
            padding: 9px;
            background: linear-gradient(90deg, #9333ea, #c084fc);
            border: 1px solid #ffd700;
            border-radius: 6px;
            color: #090312;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
        }

        .stamped-banner {
            text-align: center;
            padding: 9px;
            border: 2px dashed #4ade80;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.8);
        }

        .activation-card {
            background: #170928;
            border: 2px solid var(--purple-border);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            margin-top: 30px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .reward-card {
            background: linear-gradient(160deg, #240a3e 0%, #0d0218 100%);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 24px 18px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 35px rgba(251, 191, 36, 0.7);
            animation: modal-appear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modal-appear {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .reward-icon { font-size: 50px; margin-bottom: 6px; }
        .reward-badge-title {
            color: #ffd700; font-size: 21px; font-weight: 900; margin: 0 0 6px 0;
        }
        .reward-item-box {
            background: rgba(88, 28, 135, 0.5);
            border: 2px dashed #ffd700;
            border-radius: 12px;
            padding: 12px;
            margin: 12px 0;
        }
        .reward-item-name { font-size: 18px; font-weight: 900; color: #fef08a; }
        .reward-tip { font-size: 12px; color: #cbd5e1; margin-bottom: 14px; }
        .btn-claim {
            width: 100%;
            padding: 11px;
            background: linear-gradient(90deg, #d97706, #fbbf24);
            border: 2px solid #fff;
            border-radius: 8px;
            color: #000;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-close-modal {
            background: transparent; border: none; color: #a855f7; font-size: 12px; text-decoration: underline; cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>

    <script>
        const LIFF_ID = '2012258408-yrd0t2GN';
        const API_URL = 'https://wsphfkvqquztearorpkd.supabase.co/rest/v1';
        const API_KEY = 'sb_publishable_B9mdwTlyqRCRMPRK4o2Enw_eiUY5vU-';

        const REWARD_STAFF_PIN = '8888';
        const REWARD_NAME = '【初階試煉者：公會專屬檔案夾】';

        const apiHeaders = {
            'apikey': API_KEY,
            'Authorization': 'Bearer ' + API_KEY,
            'Content-Type': 'application/json'
        };

        const NODE_POSITIONS = [
            { x: 30, y: 72 }, // 據點 1：幻覺博物館
            { x: 68, y: 29 }, // 據點 2：女森創意製作所
            { x: 49, y: 47 }  // 據點 3：三拾叁精品茶飲
        ];

        let currentUserId = null;
        let currentCode = null;
        let merchantsList = [];
        let stampedSet = new Set();
        let selectedMerchantId = null;
        let isRewardClaimed = false;
        let rewardClaimedAt = null;

        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                currentUserId = profile.userId;
            } catch (err) {
                let savedId = localStorage.getItem('gandalf_liff_uid');
                if (!savedId) {
                    savedId = 'TEST_USER_' + Math.floor(1000 + Math.random() * 9000);
                    localStorage.setItem('gandalf_liff_uid', savedId);
                }
                currentUserId = savedId;
            }

            currentCode = localStorage.getItem('gandalf_active_code');
            if (currentCode) {
                await checkCurrentCodeValid();
            } else {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('activationSection').classList.remove('hidden');
            }
        }

        async function checkCurrentCodeValid() {
            try {
                const res = await fetch(`${API_URL}/activation_codes?code=eq.${currentCode}&select=*`, { headers: apiHeaders });
                const list = await res.json();
                document.getElementById('loading').classList.add('hidden');

                if (Array.isArray(list) && list.length > 0 && list[0].is_used) {
                    document.getElementById('currentCodeDisplay').innerText = currentCode;
                    document.getElementById('mapSection').classList.remove('hidden');
                    document.getElementById('activationSection').classList.add('hidden');
                    loadMapData();
                } else {
                    localStorage.removeItem('gandalf_active_code');
                    document.getElementById('activationSection').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('loading').innerText = '魔力樞紐連線異常，請重新整理頁面。';
            }
        }

        async function handleActivation() {
            const code = document.getElementById('activationInput').value.trim().toUpperCase();
            const msg = document.getElementById('activationMsg');
            if (!code) return;

            msg.innerText = '正在尋求公會認證...';
            msg.style.color = '#c084fc';

            const res = await fetch(`${API_URL}/activation_codes?code=eq.${code}&select=*`, { headers: apiHeaders });
            const data = await res.json();

            if (!Array.isArray(data) || data.length === 0) {
                msg.innerText = '❌ 查無此通關密語。';
                msg.style.color = '#f87171';
                return;
            }

            if (data[0].is_used && data[0].line_user_id !== currentUserId) {
                msg.innerText = '❌ 此密語已被其他冒險者使用過。';
                msg.style.color = '#f87171';
                return;
            }

            if (!data[0].is_used) {
                await fetch(`${API_URL}/activation_codes?code=eq.${code}`, {
                    method: 'PATCH',
                    headers: apiHeaders,
                    body: JSON.stringify({ is_used: true, line_user_id: currentUserId, activated_at: new Date().toISOString() })
                });
            }

            currentCode = code;
            localStorage.setItem('gandalf_active_code', currentCode);
            document.getElementById('currentCodeDisplay').innerText = currentCode;

            msg.innerText = '✨ 啟動成功！正在展開公會地圖...';
            msg.style.color = '#4ade80';

            setTimeout(() => {
                document.getElementById('activationSection').classList.add('hidden');
                document.getElementById('mapSection').classList.remove('hidden');
                loadMapData();
            }, 400);
        }

        async function loadMapData() {
            try {
                const [mRes, sRes, rRes] = await Promise.all([
                    fetch(`${API_URL}/merchants?select=*&order=id.asc`, { headers: apiHeaders }),
                    fetch(`${API_URL}/user_stamps?code=eq.${currentCode}&select=merchant_id`, { headers: apiHeaders }),
                    fetch(`${API_URL}/user_rewards?code=eq.${currentCode}&reward_name=eq.${encodeURIComponent(REWARD_NAME)}&select=*`, { headers: apiHeaders })
                ]);

                const mData = await mRes.json();
                const sData = await sRes.json();
                const rData = await rRes.json();

                merchantsList = Array.isArray(mData) ? mData : [];
                const stamps = Array.isArray(sData) ? sData : [];
                const rewards = Array.isArray(rData) ? rData : [];

                stampedSet = new Set(stamps.map(s => s.merchant_id));

                if (rewards.length > 0) {
                    isRewardClaimed = true;
                    rewardClaimedAt = new Date(rewards[0].claimed_at).toLocaleString();
                } else {
                    isRewardClaimed = false;
                    rewardClaimedAt = null;
                }

                const stampCount = stampedSet.size;
                const totalCount = merchantsList.length || 3;
                const pBar = document.getElementById('progressBar');

                if (stampCount >= 3) {
                    pBar.classList.add('reward-ready');
                    if (isRewardClaimed) {
                        document.getElementById('stampCountText').innerHTML = `🌟 試煉達成！本票券獎品已領取`;
                        document.getElementById('stampSubText').innerHTML = `✦ 已於 ${rewardClaimedAt} 完成實體檔案夾核銷 ✦`;
                    } else {
                        document.getElementById('stampCountText').innerHTML = `🎉 試煉達成！已集滿 ${stampCount} / ${totalCount} 間據點`;
                        document.getElementById('stampSubText').innerHTML = `🎁 點此出示領取【公會專屬檔案夾】特權獎勵 ❯`;
                        
                        const hasShownModal = sessionStorage.getItem('reward_shown_' + currentCode);
                        if (!hasShownModal) {
                            showRewardModal();
                            sessionStorage.setItem('reward_shown_' + currentCode, 'true');
                        }
                    }
                } else {
                    pBar.classList.remove('reward-ready');
                    document.getElementById('stampCountText').innerText = `探索進度：已集點 ${stampCount} / ${totalCount} 間據點`;
                    document.getElementById('stampSubText').innerText = `✦ 集滿 3 間據點即可解鎖「公會專屬檔案夾」✦`;
                }

                if (!selectedMerchantId && merchantsList.length > 0) {
                    selectedMerchantId = merchantsList[0].id;
                }

                renderMapNodes();
                renderSelectedDetail();
                updateRewardModalUI();
            } catch (err) {
                console.error("載入地圖失敗：", err);
            }
        }

        function renderMapNodes() {
            const container = document.getElementById('nodesContainer');
            container.innerHTML = '';

            merchantsList.forEach((m, idx) => {
                const pos = NODE_POSITIONS[idx] || { x: 30 + idx * 25, y: 30 + idx * 20 };
                const isStamped = stampedSet.has(m.id);
                const isSelected = m.id === selectedMerchantId;

                const nodeEl = document.createElement('div');
                nodeEl.className = `map-node ${isStamped ? 'stamped' : ''} ${isSelected ? 'active' : ''}`;
                nodeEl.style.left = `${pos.x}%`;
                nodeEl.style.top = `${pos.y}%`;
                nodeEl.onclick = () => selectMerchant(m.id);

                nodeEl.innerHTML = `
                    <div class="node-pin">${isStamped ? '✓' : (idx + 1)}</div>
                    <div class="node-label">${m.name}</div>
                `;
                container.appendChild(nodeEl);
            });
        }

        function selectMerchant(id) {
            selectedMerchantId = id;
            renderMapNodes();
            renderSelectedDetail();
        }

        function renderSelectedDetail() {
            const m = merchantsList.find(item => item.id === selectedMerchantId);
            const detailContainer = document.getElementById('detailContent');
            if (!m) {
                detailContainer.innerHTML = '<p style="text-align:center; color:#c084fc;">尚無可展示的據點資訊</p>';
                return;
            }

            const isStamped = stampedSet.has(m.id);
            const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m.address)}`;

            detailContainer.innerHTML = `
                <h3 class="detail-name">${m.name}</h3>
                <div class="detail-discount">📜 特權優惠：${m.discount_info}</div>
                <div class="detail-address">📍 據點地址：${m.address}</div>
                
                <a href="${navUrl}" target="_blank" class="btn-navigation">
                    🧭 開啟 Google Maps 實境導航
                </a>

                ${isStamped 
                    ? `<div class="stamped-banner">✦ 本票券已完成集點 ‧ 印記已點亮 ✦</div>`
                    : `
                        <div class="verify-group">
                            <input type="password" id="currentPinInput" class="pin-input" placeholder="店員 PIN 碼" maxlength="6">
                            <button onclick="verifyCurrentStore('${m.pin_code}')" class="btn-verify">現場核銷</button>
                        </div>
                        <div id="verifyMsg" style="margin-top:6px; font-size:12.5px; font-weight:bold; text-align:center;"></div>
                    `
                }
            `;
        }

        // 🌟 現場核銷防呆邏輯
        async function verifyCurrentStore(correctPin) {
            const input = document.getElementById('currentPinInput').value.trim();
            const msg = document.getElementById('verifyMsg');

            if (input !== correctPin) {
                msg.innerText = '❌ 核銷密碼錯誤！';
                msg.style.color = '#f87171';
                return;
            }

            msg.innerText = '正在點亮公會印記...';
            msg.style.color = '#ffd700';

            try {
                const res = await fetch(`${API_URL}/user_stamps`, {
                    method: 'POST',
                    headers: apiHeaders,
                    body: JSON.stringify({ 
                        code: currentCode,
                        merchant_id: selectedMerchantId,
                        line_user_id: currentUserId
                    })
                });

                // 若已成功寫入，或先前已核銷過 (409 重複衝突)，皆判定為已蓋章完成
                if (res.ok || res.status === 409) {
                    stampedSet.add(selectedMerchantId);
                    msg.innerText = '✨ 核銷成功，地圖印記已點亮！';
                    msg.style.color = '#4ade80';
                    setTimeout(() => loadMapData(), 400);
                } else {
                    const err = await res.json();
                    msg.innerText = '⚠️ 核銷異常：' + (err.message || '請重新整理後再試');
                    msg.style.color = '#f87171';
                }
            } catch (e) {
                msg.innerText = '❌ 連線異常，請稍後重試';
                msg.style.color = '#f87171';
            }
        }

        function showRewardModal() {
            updateRewardModalUI();
            document.getElementById('rewardModal').classList.remove('hidden');
        }

        function closeRewardModal() {
            document.getElementById('rewardModal').classList.add('hidden');
        }

        function checkAndOpenReward() {
            if (stampedSet.size >= 3) {
                showRewardModal();
            }
        }

        function updateRewardModalUI() {
            const area = document.getElementById('rewardActionArea');
            if (isRewardClaimed) {
                area.innerHTML = `
                    <div style="background:rgba(34,197,94,0.18); border:2px dashed #4ade80; color:#4ade80; padding:10px; border-radius:8px; font-weight:bold; font-size:14px; margin-bottom:8px;">
                        ✅ 本票券已完成實體核銷兌換<br>
                        <span style="font-size:11px; color:#cbd5e1;">核銷時間：${rewardClaimedAt}</span>
                    </div>
                `;
            } else {
                area.innerHTML = `
                    <div style="margin-top:6px;">
                        <input type="password" id="staffRewardPin" class="pin-input" style="width:100%; margin-bottom:8px; font-size:15px; text-align:center;" placeholder="請工作人員輸入核銷 PIN 碼" maxlength="6">
                        <button class="btn-claim" id="btnClaimReward" onclick="claimRewardStaff()">工作人員確認核銷</button>
                        <div id="rewardClaimMsg" style="font-size:12px; margin-top:5px; font-weight:bold; text-align:center;"></div>
                    </div>
                `;
            }
        }

        async function claimRewardStaff() {
            const pinInput = document.getElementById('staffRewardPin').value.trim();
            const msg = document.getElementById('rewardClaimMsg');

            if (!pinInput) {
                msg.innerText = '請輸入工作人員核銷碼';
                msg.style.color = '#f87171';
                return;
            }

            if (pinInput !== REWARD_STAFF_PIN) {
                msg.innerText = '❌ 工作人員核銷密碼錯誤！';
                msg.style.color = '#f87171';
                return;
            }

            const btn = document.getElementById('btnClaimReward');
            btn.disabled = true;
            btn.innerText = '正在寫入公會兌換名冊...';

            try {
                const res = await fetch(`${API_URL}/user_rewards`, {
                    method: 'POST',
                    headers: apiHeaders,
                    body: JSON.stringify({
                        code: currentCode,
                        line_user_id: currentUserId,
                        reward_name: REWARD_NAME
                    })
                });

                if (res.ok || res.status === 409) {
                    alert('🎉 核銷成功！已交付獎品並記錄於後台數據庫。');
                    loadMapData();
                } else {
                    throw new Error('伺服器記錄失敗');
                }
            } catch (e) {
                msg.innerText = '❌ 核銷失敗：' + e.message;
                msg.style.color = '#f87171';
                btn.disabled = false;
                btn.innerText = '工作人員確認核銷';
            }
        }

        function switchAnotherCode() {
            if (confirm('是否要切換或輸入另一組通關密語？\n（您隨時可以再切換回原本的密語查看進度）')) {
                localStorage.removeItem('gandalf_active_code');
                document.getElementById('mapSection').classList.add('hidden');
                document.getElementById('activationSection').classList.remove('hidden');
                document.getElementById('activationInput').value = '';
                document.getElementById('activationMsg').innerText = '';
            }
        }

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
