<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桿道夫《魔法地圖》</title>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --rift-purple: #9333ea;
            --rift-glow: #c084fc;
            --gold-light: #fef08a;
            --gold-bright: #fbbf24;
            --gold-dark: #b45309;
            --bg-night: #090312;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background-color: var(--bg-night);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(147, 51, 234, 0.45) 0%, transparent 60%),
                radial-gradient(circle at 15% 45%, rgba(192, 132, 252, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(245, 158, 11, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #090312 0%, #150727 50%, #090312 100%);
            color: #f3e8ff;
            margin: 0;
            padding: 16px 12px 60px;
            min-height: 100vh;
        }

        .map-board {
            max-width: 460px;
            margin: auto;
            position: relative;
        }

        /* 頂部標題 */
        .header-section {
            text-align: center;
            padding: 10px 0 16px;
        }
        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.8), 0 0 25px rgba(168, 85, 247, 0.8);
            margin: 0;
        }
        .sub-title {
            font-size: 13px;
            color: #d8b4fe;
            margin-top: 6px;
            letter-spacing: 3px;
        }

        /* 集點進度追蹤框 */
        .quest-progress-box {
            background: rgba(30, 11, 55, 0.85);
            border: 2px solid #a855f7;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 22px;
            text-align: center;
        }
        .progress-title {
            color: #ffd700;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .progress-desc {
            font-size: 12px;
            color: #c084fc;
            margin-top: 4px;
        }

        /* 羊皮紙探索畫布 */
        .parchment-canvas {
            background: #e8d7b8;
            background-image: 
                radial-gradient(circle, rgba(248, 239, 219, 0.96) 0%, rgba(216, 189, 142, 0.98) 100%),
                repeating-linear-gradient(45deg, rgba(80, 50, 20, 0.03) 0px, rgba(80, 50, 20, 0.03) 2px, transparent 2px, transparent 6px);
            border: 6px double #6b4320;
            border-radius: 16px;
            padding: 24px 14px 18px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(92, 53, 20, 0.4);
            position: relative;
        }

        .corner-rune {
            position: absolute;
            font-size: 14px;
            color: #6b4320;
            font-family: 'Cinzel', serif;
        }
        .cr-tl { top: 8px; left: 8px; }
        .cr-tr { top: 8px; right: 8px; }
        .cr-bl { bottom: 8px; left: 8px; }
        .cr-br { bottom: 8px; right: 8px; }

        /* 店家拱門卡牌 */
        .store-card {
            background: #170928;
            border: 3px solid #7e22ce;
            border-radius: 54px 54px 14px 14px;
            padding: 22px 14px 16px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(147, 51, 234, 0.4);
            color: #f3e8ff;
        }
        .store-card::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 50px 50px 10px 10px;
            pointer-events: none;
        }

        /* 頂部序號圓徽章 */
        .store-sigil {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, #3b0764 0%, #090312 100%);
            border: 2px solid #ffd700;
            border-radius: 50%;
            margin: -45px auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: #ffd700;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.8), 0 0 22px rgba(168, 85, 247, 0.7);
        }

        /* 店家標題直接呈現 */
        .store-name {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 14px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.7);
        }

        /* 特權優惠框 */
        .store-perk {
            background: rgba(59, 7, 100, 0.6);
            border-left: 4px solid #fbbf24;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 14px;
            color: #fef08a;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .store-address {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* Google Maps 實境導航按鈕 */
        .btn-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(90deg, #4c1d95, #6d28d9);
            color: #fef08a;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            border: 1px solid #a855f7;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
            margin-bottom: 12px;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn-navigation:hover {
            background: linear-gradient(90deg, #5b21b6, #7c3aed);
            box-shadow: 0 0 18px rgba(192, 132, 252, 0.7);
        }

        /* 核銷輸入與按鈕 */
        .pin-box {
            display: flex;
            gap: 6px;
        }
        .pin-input {
            flex: 1;
            padding: 10px;
            background: #0d0419;
            border: 1px solid #7e22ce;
            border-radius: 6px;
            color: #ffd700;
            font-size: 15px;
            text-align: center;
            letter-spacing: 3px;
        }
        .pin-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }
        .btn-verify {
            flex: 1;
            padding: 10px;
            background: linear-gradient(90deg, #9333ea, #c084fc);
            border: 1px solid #ffd700;
            border-radius: 6px;
            color: #090312;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
        }

        /* 已集點封印章 */
        .stamped-seal {
            text-align: center;
            padding: 12px;
            border: 2px dashed #4ade80;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
            margin-top: 6px;
        }

        /* 啟用視窗 */
        .activation-card {
            background: #170928;
            border: 2px solid #a855f7;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            margin-top: 30px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="map-board">
        <!-- 頂部標題 -->
        <div class="header-section">
            <h1 class="main-title">✨ 桿道夫魔法地圖 ✨</h1>
            <div class="sub-title">特約探索據點 ‧ 試煉啟程</div>
        </div>

        <!-- 連線載入中 -->
        <div id="loading" style="text-align:center; padding: 40px 10px; color:#c084fc; font-size:16px;">
            正在感應公會魔力航道...
        </div>

        <!-- 啟用碼輸入區 -->
        <div id="activationSection" class="activation-card hidden">
            <div class="store-sigil">📜</div>
            <h2 style="color:#ffd700; margin:10px 0 6px;">解鎖魔法探索地圖</h2>
            <p style="font-size: 13px; color: #d8b4fe; margin-bottom:16px;">請輸入聯票專屬 6 碼通關密語：</p>
            <input type="text" id="activationInput" class="pin-input" style="width:100%; margin-bottom:12px; font-size:18px;" placeholder="例：TEST01" />
            <button onclick="handleActivation()" class="btn-verify" style="width:100%; padding:12px; font-size:16px;">開啟探索特權</button>
            <div id="activationMsg" style="margin-top:10px; font-size:13px; font-weight:bold;"></div>
        </div>

        <!-- 正式探索地圖區 -->
        <div id="mapSection" class="hidden">
            <!-- 進度追蹤 -->
            <div class="quest-progress-box">
                <div class="progress-title" id="stampCountText">探索進度：已集點 0 / 3 間合作據點</div>
                <div class="progress-desc">✦ 集滿 3 間據點，即可至場館領取「公會專屬檔案夾」✦</div>
            </div>

            <!-- 羊皮紙探索畫布 -->
            <div class="parchment-canvas">
                <span class="corner-rune cr-tl">✦ I</span>
                <span class="corner-rune cr-tr">✦ II</span>
                <span class="corner-rune cr-bl">✦ III</span>
                <span class="corner-rune cr-br">✦ IV</span>

                <div style="text-align:center; margin-bottom:20px; font-size:13px; font-weight:bold; color:#5c3514; letter-spacing:2px;">
                    📜 合作特約探索名冊 📜
                </div>

                <!-- 店家卡牌容器 -->
                <div id="merchantContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const LIFF_ID = '2012258408-yrd0t2GN';
        const API_URL = 'https://wsphfkvqquztearorpkd.supabase.co/rest/v1';
        const API_KEY = 'sb_publishable_B9mdwTlyqRCRMPRK4o2Enw_eiUY5vU-';

        const apiHeaders = {
            'apikey': API_KEY,
            'Authorization': 'Bearer ' + API_KEY,
            'Content-Type': 'application/json'
        };

        let currentUserId = null;

        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                currentUserId = profile.userId;

                await checkUserStatus();
            } catch (err) {
                let savedId = localStorage.getItem('gandalf_liff_uid');
                if (!savedId) {
                    savedId = 'TEST_LINE_USER_' + Math.floor(1000 + Math.random() * 9000);
                    localStorage.setItem('gandalf_liff_uid', savedId);
                }
                currentUserId = savedId;
                await checkUserStatus();
            }
        }

        async function checkUserStatus() {
            try {
                const res = await fetch(`${API_URL}/activation_codes?line_user_id=eq.${currentUserId}&select=*`, { headers: apiHeaders });
                const list = await res.json();
                document.getElementById('loading').classList.add('hidden');

                if (list && list.length > 0 && list[0].is_used) {
                    document.getElementById('mapSection').classList.remove('hidden');
                    loadMerchants();
                } else {
                    document.getElementById('activationSection').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('loading').innerText = '魔力樞紐連線異常，請重新整理頁面。';
            }
        }

        async function handleActivation() {
            const code = document.getElementById('activationInput').value.trim().toUpperCase();
            const msg = document.getElementById('activationMsg');
            if (!code) return;

            msg.innerText = '正在驗證通關密語...';
            msg.style.color = '#c084fc';

            const res = await fetch(`${API_URL}/activation_codes?code=eq.${code}&select=*`, { headers: apiHeaders });
            const data = await res.json();

            if (!data || data.length === 0) {
                msg.innerText = '❌ 查無此通關密語。';
                msg.style.color = '#f87171';
                return;
            }

            if (data[0].is_used) {
                msg.innerText = '❌ 此密語已被其他冒險者使用。';
                msg.style.color = '#f87171';
                return;
            }

            await fetch(`${API_URL}/activation_codes?code=eq.${code}`, {
                method: 'PATCH',
                headers: apiHeaders,
                body: JSON.stringify({ is_used: true, line_user_id: currentUserId, activated_at: new Date().toISOString() })
            });

            msg.innerText = '✨ 啟動成功！正在展開地圖名冊...';
            msg.style.color = '#4ade80';

            setTimeout(() => {
                document.getElementById('activationSection').classList.add('hidden');
                document.getElementById('mapSection').classList.remove('hidden');
                loadMerchants();
            }, 500);
        }

        async function loadMerchants() {
            const container = document.getElementById('merchantContainer');
            container.innerHTML = '<p style="text-align:center; color:#5c3514;">正在讀取合作店家名冊...</p>';

            const [mRes, sRes] = await Promise.all([
                fetch(`${API_URL}/merchants?select=*&order=id.asc`, { headers: apiHeaders }),
                fetch(`${API_URL}/user_stamps?line_user_id=eq.${currentUserId}&select=merchant_id`, { headers: apiHeaders })
            ]);

            const merchants = await mRes.json();
            const stamps = await sRes.json();
            const stampedSet = new Set((stamps || []).map(s => s.merchant_id));

            // 更新累積進度
            document.getElementById('stampCountText').innerText = `探索進度：已集點 ${stamps.length} / ${merchants.length} 間合作據點`;

            container.innerHTML = '';

            merchants.forEach((m, idx) => {
                const isStamped = stampedSet.has(m.id);
                const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m.address)}`;

                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <div class="store-sigil">${idx + 1}</div>
                    <h3 class="store-name">${m.name}</h3>
                    <div class="store-perk">📜 特權優惠：${m.discount_info}</div>
                    <div class="store-address">📍 店家地址：${m.address}</div>
                    
                    <a href="${navUrl}" target="_blank" class="btn-navigation">
                        🧭 前往導航（開啟 Google Maps）
                    </a>

                    ${isStamped 
                        ? `<div class="stamped-seal">✦ 已完成集點 ✦</div>`
                        : `
                            <div class="pin-box">
                                <input type="password" id="pin_${m.id}" class="pin-input" placeholder="店員 PIN 碼" maxlength="6">
                                <button onclick="verifyStorePin(${m.id}, '${m.pin_code}')" class="btn-verify">現場核銷</button>
                            </div>
                            <div id="stampMsg_${m.id}" style="margin-top:6px; font-size:13px; font-weight:bold; text-align:center;"></div>
                        `
                    }
                `;
                container.appendChild(card);
            });
        }

        async function verifyStorePin(merchantId, correctPin) {
            const input = document.getElementById(`pin_${merchantId}`).value.trim();
            const msg = document.getElementById(`stampMsg_${merchantId}`);

            if (input !== correctPin) {
                msg.innerText = '❌ 核銷密碼錯誤！';
                msg.style.color = '#f87171';
                return;
            }

            const res = await fetch(`${API_URL}/user_stamps`, {
                method: 'POST',
                headers: apiHeaders,
                body: JSON.stringify({ line_user_id: currentUserId, merchant_id: merchantId })
            });

            if (!res.ok) {
                msg.innerText = '⚠️ 本店已完成集點！';
                msg.style.color = '#fbbf24';
                return;
            }

            msg.innerText = '✨ 核銷完成，已成功集點！';
            msg.style.color = '#4ade80';
            setTimeout(() => loadMerchants(), 500);
        }

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
</html>
