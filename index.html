<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桿道夫《魔法航海地圖》探索試煉</title>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-bright: #fbbf24;
            --gold-glow: #ffd700;
            --purple-dark: #120524;
            --purple-border: #7e22ce;
            --purple-glow: #c084fc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background-color: var(--purple-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(147, 51, 234, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, #090214 0%, #17072e 50%, #090214 100%);
            color: #f3e8ff;
            margin: 0;
            padding: 12px 10px 40px;
            min-height: 100vh;
        }

        .map-wrapper {
            max-width: 480px;
            margin: auto;
            position: relative;
        }

        /* 頂部標題 */
        .title-header {
            text-align: center;
            padding: 8px 0 12px;
            position: relative;
        }
        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--gold-glow);
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.8), 0 0 25px rgba(168, 85, 247, 0.8);
            margin: 0;
        }
        .sub-title {
            font-size: 12px;
            color: #d8b4fe;
            margin-top: 4px;
            letter-spacing: 3px;
        }
        .btn-reset-test {
            position: absolute;
            right: 0;
            top: 6px;
            background: rgba(88, 28, 135, 0.5);
            border: 1px solid #a855f7;
            color: #d8b4fe;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 集點進度條 / 獎勵領取浮動橫幅 */
        .progress-bar {
            background: rgba(35, 11, 65, 0.9);
            border: 1px solid var(--purple-border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            text-align: center;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            transition: 0.3s;
        }
        .progress-bar.reward-ready {
            background: linear-gradient(90deg, rgba(88, 28, 135, 0.95), rgba(180, 83, 9, 0.95));
            border-color: #ffd700;
            box-shadow: 0 0 18px rgba(251, 191, 36, 0.6);
            cursor: pointer;
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(251, 191, 36, 0.9); }
        }
        .progress-text {
            color: var(--gold-glow);
            font-size: 15px;
            font-weight: 900;
        }
        .progress-sub {
            font-size: 11px;
            color: #c084fc;
            margin-top: 2px;
        }

        /* 📜 圖二：中世紀復古航海羊皮紙卷軸畫布 📜 */
        .scroll-map-container {
            position: relative;
            width: 100%;
            height: 480px;
            margin-bottom: 16px;
            filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.8));
        }

        /* 卷軸手繪與地圖向量圖層 */
        .scroll-svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 📍 地圖據點點位 (Marker Pin) */
        .map-node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .map-node:active, .map-node.active {
            transform: translate(-50%, -50%) scale(1.18);
        }

        /* 據點徽章造型 */
        .node-pin {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, #2d0b4e 0%, #0c0217 100%);
            border: 3px solid #ffd700;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.95), 0 4px 10px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 900;
            color: #ffd700;
            transition: 0.3s;
        }
        .map-node.stamped .node-pin {
            background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
            border-color: #4ade80;
            color: #4ade80;
            box-shadow: 0 0 18px rgba(74, 222, 128, 0.95);
        }

        /* 據點下方標籤 */
        .node-label {
            background: rgba(18, 5, 34, 0.94);
            color: #fef08a;
            border: 1px solid #eab308;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 900;
            margin-top: 4px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }
        .map-node.stamped .node-label {
            border-color: #4ade80;
            color: #86efac;
        }

        /* 📜 底部據點詳細資訊卷軸卡片 */
        .detail-card {
            background: #170928;
            border: 2px solid var(--purple-border);
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 18px rgba(147, 51, 234, 0.4);
            position: relative;
        }
        .detail-name {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 10px 0;
            text-align: center;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.7);
        }
        .detail-discount {
            background: rgba(59, 7, 100, 0.6);
            border-left: 4px solid var(--gold-bright);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            color: #fef08a;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .detail-address {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* 導航按鈕 */
        .btn-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(90deg, #4c1d95, #6d28d9);
            color: #fef08a;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            border: 1px solid #a855f7;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* 核銷區塊 */
        .verify-group {
            display: flex;
            gap: 6px;
        }
        .pin-input {
            flex: 1;
            padding: 10px;
            background: #0d0419;
            border: 1px solid var(--purple-border);
            border-radius: 6px;
            color: #ffd700;
            font-size: 15px;
            text-align: center;
            letter-spacing: 3px;
        }
        .pin-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }
        .btn-verify {
            flex: 1;
            padding: 10px;
            background: linear-gradient(90deg, #9333ea, #c084fc);
            border: 1px solid #ffd700;
            border-radius: 6px;
            color: #090312;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
        }

        /* 已蓋章完成狀態 */
        .stamped-banner {
            text-align: center;
            padding: 10px;
            border: 2px dashed #4ade80;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
        }

        /* 啟用卡牌 */
        .activation-card {
            background: #170928;
            border: 2px solid var(--purple-border);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            margin-top: 30px;
        }

        /* 🏆 榮譽獎勵彈窗 🏆 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .reward-card {
            background: linear-gradient(160deg, #240a3e 0%, #0d0218 100%);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 24px 18px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 35px rgba(251, 191, 36, 0.7), inset 0 0 20px rgba(168, 85, 247, 0.4);
            animation: modal-appear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modal-appear {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .reward-icon {
            font-size: 52px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8));
        }
        .reward-badge-title {
            color: #ffd700;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
        }
        .reward-item-box {
            background: rgba(88, 28, 135, 0.5);
            border: 2px dashed #ffd700;
            border-radius: 12px;
            padding: 14px;
            margin: 14px 0;
        }
        .reward-item-name {
            font-size: 19px;
            font-weight: 900;
            color: #fef08a;
            letter-spacing: 1px;
        }
        .reward-tip {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .btn-claim {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #d97706, #fbbf24);
            border: 2px solid #fff;
            border-radius: 8px;
            color: #000;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
            margin-bottom: 8px;
        }
        .btn-close-modal {
            background: transparent;
            border: none;
            color: #a855f7;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="map-wrapper">
        <div class="title-header">
            <h1 class="main-title">✨ 桿道夫魔法地圖 ✨</h1>
            <div class="sub-title">秘境試煉 ‧ 探索啟程</div>
            <button class="btn-reset-test" onclick="resetTestState()">🔄 重設測試</button>
        </div>

        <div id="loading" style="text-align:center; padding: 40px 10px; color:#c084fc; font-size:16px;">
            正在感應公會魔力航道...
        </div>

        <!-- 啟用碼輸入區 -->
        <div id="activationSection" class="activation-card hidden">
            <div style="font-size:36px; margin-bottom:8px;">📜</div>
            <h2 style="color:#ffd700; margin:0 0 8px;">解鎖魔法探索地圖</h2>
            <p style="font-size: 13px; color: #d8b4fe; margin-bottom:16px;">請輸入聯票專屬 6 碼通關密語：</p>
            <input type="text" id="activationInput" class="pin-input" style="width:100%; margin-bottom:12px; font-size:18px;" placeholder="例：TEST01" />
            <button onclick="handleActivation()" class="btn-verify" style="width:100%; padding:12px; font-size:16px;">開啟探索特權</button>
            <div id="activationMsg" style="margin-top:10px; font-size:13px; font-weight:bold;"></div>
        </div>

        <!-- 正式地圖探索世界（圖二古典羊皮紙卷軸風格） -->
        <div id="mapSection" class="hidden">
            <div class="progress-bar" id="progressBar" onclick="checkAndOpenReward()">
                <div class="progress-text" id="stampCountText">探索進度：已集點 0 / 3 間據點</div>
                <div class="progress-sub" id="stampSubText">✦ 點擊地圖上的金色圓點，可切換據點導航與現場核銷 ✦</div>
            </div>

            <!-- 📜 卷軸式羊皮紙航海大地圖容器 📜 -->
            <div class="scroll-map-container" id="mapCanvas">
                <svg class="scroll-svg-layer" viewBox="0 0 420 500" preserveAspectRatio="none">
                    <defs>
                        <!-- 羊皮紙底紋漸層 -->
                        <radialGradient id="parchmentBase" cx="50%" cy="50%" r="55%">
                            <stop offset="0%" stop-color="#faedd2"/>
                            <stop offset="65%" stop-color="#eccfa3"/>
                            <stop offset="100%" stop-color="#cb9d64"/>
                        </radialGradient>
                        <!-- 木質軸心漸層 -->
                        <linearGradient id="woodGradient" x1="0" y1="0" x2="0" y2="100%">
                            <stop offset="0%" stop-color="#4a250e"/>
                            <stop offset="40%" stop-color="#844820"/>
                            <stop offset="70%" stop-color="#5a2d13"/>
                            <stop offset="100%" stop-color="#2b1206"/>
                        </linearGradient>
                    </defs>

                    <!-- 1. 羊皮紙主體（邊緣撕裂與鋸齒不規則造型） -->
                    <path d="
                        M 30,30 
                        L 55,28 L 70,32 L 120,29 L 140,32 L 200,28 L 220,32 L 280,28 L 310,32 L 360,28 L 390,30
                        L 392,60 L 387,75 L 392,95 L 385,120 L 393,145 L 386,175 L 393,210 L 385,245 L 392,280 L 386,320 L 393,365 L 387,410 L 392,440 L 390,470
                        L 360,472 L 340,468 L 280,472 L 250,467 L 190,472 L 150,468 L 90,472 L 60,468 L 30,470
                        L 28,440 L 33,410 L 27,370 L 34,325 L 28,280 L 33,235 L 27,190 L 34,145 L 28,105 L 33,70 Z"
                        fill="url(#parchmentBase)" stroke="#532d12" stroke-width="2.5" />

                    <!-- 2. 卷軸頂部木質滾軸 -->
                    <g id="topRoller">
                        <rect x="20" y="14" width="380" height="18" rx="6" fill="url(#woodGradient)" stroke="#2b1206" stroke-width="2" />
                        <ellipse cx="20" cy="23" rx="7" ry="11" fill="#693717" stroke="#2b1206" stroke-width="2"/>
                        <ellipse cx="400" cy="23" rx="7" ry="11" fill="#693717" stroke="#2b1206" stroke-width="2"/>
                        <!-- 捲紙陰影 -->
                        <path d="M 28,30 C 100,24 320,24 392,30" fill="none" stroke="#3d1e0a" stroke-width="3" opacity="0.6"/>
                    </g>

                    <!-- 3. 卷軸底部木質滾軸 -->
                    <g id="bottomRoller">
                        <rect x="20" y="468" width="380" height="18" rx="6" fill="url(#woodGradient)" stroke="#2b1206" stroke-width="2" />
                        <ellipse cx="20" cy="477" rx="7" ry="11" fill="#693717" stroke="#2b1206" stroke-width="2"/>
                        <ellipse cx="400" cy="477" rx="7" ry="11" fill="#693717" stroke="#2b1206" stroke-width="2"/>
                        <!-- 捲紙陰影 -->
                        <path d="M 28,470 C 100,476 320,476 392,470" fill="none" stroke="#3d1e0a" stroke-width="3" opacity="0.6"/>
                    </g>

                    <!-- 4. 航海羅盤圖騰（左上方大型八芒羅盤，完全還原圖二） -->
                    <g transform="translate(120, 140)">
                        <!-- 羅盤外圈刻度環 -->
                        <circle cx="0" cy="0" r="42" fill="none" stroke="#71421f" stroke-width="1.8"/>
                        <circle cx="0" cy="0" r="38" fill="none" stroke="#71421f" stroke-width="1" stroke-dasharray="2,2"/>
                        <circle cx="0" cy="0" r="28" fill="none" stroke="#71421f" stroke-width="1"/>
                        <!-- 4 主方向尖芒（紅、白相間） -->
                        <polygon points="0,-52 7,-16 0,-24" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <polygon points="0,-52 -7,-16 0,-24" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="0,52 7,16 0,24" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="0,52 -7,16 0,24" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <polygon points="52,0 16,7 24,0" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <polygon points="52,0 16,-7 24,0" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="-52,0 -16,7 -24,0" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="-52,0 -16,-7 -24,0" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <!-- 4 副方向尖芒 -->
                        <polygon points="32,-32 12,-4 18,-18" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="32,-32 4,-12 18,-18" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <polygon points="-32,32 -12,4 -18,18" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="-32,32 -4,12 -18,18" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <polygon points="-32,-32 -4,-12 -18,-18" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="-32,-32 -12,-4 -18,-18" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <polygon points="32,32 4,12 18,18" fill="#fdf6e4" stroke="#521512" stroke-width="1"/>
                        <polygon points="32,32 12,4 18,18" fill="#a8231e" stroke="#521512" stroke-width="1"/>
                        <!-- 中心圓釘 -->
                        <circle cx="0" cy="0" r="5" fill="#a8231e" stroke="#2b1206" stroke-width="1.5"/>
                        <!-- 哥德方位文字 -->
                        <text x="0" y="-58" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="900" fill="#7d1e1a">N</text>
                        <text x="60" y="5" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="900" fill="#7d1e1a">E</text>
                        <text x="0" y="68" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="900" fill="#7d1e1a">S</text>
                        <text x="-60" y="5" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="900" fill="#7d1e1a">W</text>
                    </g>

                    <!-- 5. 中央航海星盤（第二羅盤，圖二中央） -->
                    <g transform="translate(205, 235)">
                        <circle cx="0" cy="0" r="26" fill="#eed9b6" stroke="#683917" stroke-width="2.5"/>
                        <circle cx="0" cy="0" r="21" fill="none" stroke="#683917" stroke-width="1" stroke-dasharray="2,2"/>
                        <!-- 8 芒指針 -->
                        <polygon points="0,-24 4,-6 0,-9 -4,-6" fill="#a8231e" />
                        <polygon points="0,24 4,6 0,9 -4,6" fill="#a8231e" />
                        <polygon points="24,0 6,4 9,0 6,-4" fill="#a8231e" />
                        <polygon points="-24,0 -6,4 -9,0 -6,-4" fill="#a8231e" />
                        <circle cx="0" cy="0" r="4" fill="#fdf6e4" stroke="#683917" stroke-width="1.5"/>
                    </g>

                    <!-- 6. 奇幻島嶼輪廓與手繪點狀海岸線（完全還原圖二中央島嶼） -->
                    <g id="fantasyIsland">
                        <!-- 海島本體 -->
                        <path d="
                            M 180,140
                            C 210,110 270,100 290,140
                            C 305,170 315,200 295,245
                            C 285,270 275,310 240,335
                            C 220,350 200,380 180,385
                            C 155,390 145,360 170,330
                            C 185,310 170,270 140,270
                            C 110,270 120,240 140,230
                            C 160,220 160,170 180,140 Z"
                            fill="#dfbf8f" stroke="#643818" stroke-width="2.5" />
                        <!-- 海岸線碎石與點狀陰影裝飾 -->
                        <path d="
                            M 176,144 C 206,116 264,106 284,144 C 298,172 308,200 289,242 C 279,266 270,304 236,328 C 217,342 198,372 179,377 C 158,381 150,356 172,328"
                            fill="none" stroke="#552c11" stroke-width="1.2" stroke-dasharray="1,4" opacity="0.8" />
                    </g>

                    <!-- 7. 圖二背景點綴：山脈、帆船與海浪 -->
                    <!-- 右上金字塔山脈 -->
                    <g stroke="#683917" stroke-width="1.4" fill="#cfa572" transform="translate(305, 75) scale(0.85)">
                        <polygon points="20,5 0,35 40,35" />
                        <line x1="20" y1="5" x2="24" y2="35" />
                        <polygon points="45,15 30,40 60,40" />
                        <line x1="45" y1="15" x2="48" y2="40" />
                    </g>

                    <!-- 右下三桅大帆船 -->
                    <g stroke="#552c11" stroke-width="1.4" fill="#eed9b6" transform="translate(290, 360) scale(0.9)">
                        <!-- 船體 -->
                        <path d="M 10,45 Q 35,52 65,45 L 60,35 L 15,35 Z" fill="#683917" />
                        <!-- 主桅杆與鼓風船帆 -->
                        <line x1="38" y1="35" x2="38" y2="5" stroke-width="2" />
                        <path d="M 38,10 Q 52,14 38,20 Q 54,25 38,32" fill="#fff9eb" />
                        <!-- 前桅杆與船帆 -->
                        <line x1="22" y1="35" x2="22" y2="12" stroke-width="1.5" />
                        <path d="M 22,15 Q 32,19 22,24 Q 33,28 22,33" fill="#fff9eb" />
                        <!-- 後桅杆 -->
                        <line x1="52" y1="35" x2="52" y2="16" stroke-width="1.5" />
                        <path d="M 52,18 Q 60,22 52,26 Q 61,30 52,34" fill="#fff9eb" />
                    </g>

                    <!-- 左側單桅小帆船 -->
                    <g stroke="#552c11" stroke-width="1.2" fill="#683917" transform="translate(70, 225) scale(0.7)">
                        <path d="M 5,28 Q 20,34 38,28 L 34,22 L 8,22 Z" />
                        <line x1="22" y1="22" x2="22" y2="4" stroke-width="1.5" />
                        <path d="M 22,6 Q 34,12 22,20 Z" fill="#fff9eb" />
                    </g>

                    <!-- 海面海浪漣漪 -->
                    <g stroke="#683917" stroke-width="1.5" fill="none" opacity="0.65">
                        <path d="M 90,390 Q 100,382 110,390 Q 120,382 130,390" />
                        <path d="M 230,410 Q 240,402 250,410 Q 260,402 270,410" />
                        <path d="M 305,270 Q 315,263 325,270 Q 335,263 345,270" />
                    </g>

                    <!-- 8. 放射狀航海虛線航道（貫穿地圖並連結 3 個據點） -->
                    <g stroke="#552c11" stroke-width="1.6" stroke-dasharray="4,4" opacity="0.75">
                        <line x1="45" y1="80" x2="380" y2="415" />
                        <line x1="380" y1="100" x2="45" y2="370" />
                        <!-- 連接 3 間店的探索軌道：幻覺博物館 -> 三拾叁茶飲 -> 女森製作所 -->
                        <path d="M 125,355 Q 185,260 205,235 T 285,145" stroke="#99231e" stroke-width="2.5" stroke-dasharray="5,5" fill="none"/>
                    </g>
                </svg>

                <!-- 📍 3 個據點圖釘（動態生成在島嶼航道上） -->
                <div id="nodesContainer"></div>
            </div>

            <!-- 底部詳細卷軸 -->
            <div class="detail-card" id="detailCard">
                <div id="detailContent">
                    <p style="text-align:center; color:#c084fc;">正在展開據點秘卷...</p>
                </div>
            </div>
        </div>

        <!-- 🏆 榮譽獎勵彈窗（含工作人員專屬 PIN 碼驗證） 🏆 -->
        <div id="rewardModal" class="modal-overlay hidden">
            <div class="reward-card">
                <div class="reward-icon">🎁</div>
                <h2 class="reward-badge-title">試煉達成 ‧ 榮譽兌換</h2>
                <p style="color:#d8b4fe; font-size:13px; margin:0;">恭喜冒險者平定 3 處公會據點！</p>
                
                <div class="reward-item-box">
                    <div style="font-size:13px; color:#ffd700; margin-bottom:4px;">✦ 特權達成獎勵 ✦</div>
                    <div class="reward-item-name">📜 公會專屬檔案夾</div>
                </div>

                <div class="reward-tip">
                    請出示此畫面給「桿道夫魔法公會」或合作特約場館工作人員輸入密碼領取。
                </div>

                <div id="rewardActionArea"></div>

                <button class="btn-close-modal" onclick="closeRewardModal()">稍後再出示 (關閉視窗)</button>
            </div>
        </div>

    </div>

    <script>
        const LIFF_ID = '2012258408-yrd0t2GN';
        const API_URL = 'https://wsphfkvqquztearorpkd.supabase.co/rest/v1';
        const API_KEY = 'sb_publishable_B9mdwTlyqRCRMPRK4o2Enw_eiUY5vU-';

        // 🌟 工作人員兌換專屬 PIN 碼
        const REWARD_STAFF_PIN = '8888';

        const apiHeaders = {
            'apikey': API_KEY,
            'Authorization': 'Bearer ' + API_KEY,
            'Content-Type': 'application/json'
        };

        const REWARD_NAME = '【初階試煉者：公會專屬檔案夾】';

        // 3 間店家在圖二航海羊皮紙地圖上的精確座標配置
        const NODE_POSITIONS = [
            { x: 30, y: 72 }, // 據點 1：幻覺博物館（島嶼西南海灣口）
            { x: 68, y: 29 }, // 據點 2：女森創意製作所（島嶼東北山脈處）
            { x: 49, y: 47 }  // 據點 3：三拾叁精品茶飲（中央航海星盤旁）
        ];

        let currentUserId = null;
        let merchantsList = [];
        let stampedSet = new Set();
        let selectedMerchantId = null;
        let isRewardClaimed = false;
        let rewardClaimedAt = null;

        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                currentUserId = profile.userId;
                await checkUserStatus();
            } catch (err) {
                let savedId = localStorage.getItem('gandalf_liff_uid');
                if (!savedId) {
                    savedId = 'TEST_USER_' + Math.floor(1000 + Math.random() * 9000);
                    localStorage.setItem('gandalf_liff_uid', savedId);
                }
                currentUserId = savedId;
                await checkUserStatus();
            }
        }

        async function checkUserStatus() {
            try {
                const res = await fetch(`${API_URL}/activation_codes?line_user_id=eq.${currentUserId}&select=*`, { headers: apiHeaders });
                const list = await res.json();
                document.getElementById('loading').classList.add('hidden');

                if (list && list.length > 0 && list[0].is_used) {
                    document.getElementById('mapSection').classList.remove('hidden');
                    document.getElementById('activationSection').classList.add('hidden');
                    loadMapData();
                } else {
                    document.getElementById('activationSection').classList.remove('hidden');
                    document.getElementById('mapSection').classList.add('hidden');
                }
            } catch (e) {
                document.getElementById('loading').innerText = '魔力樞紐連線異常，請重新整理頁面。';
            }
        }

        async function handleActivation() {
            const code = document.getElementById('activationInput').value.trim().toUpperCase();
            const msg = document.getElementById('activationMsg');
            if (!code) return;

            msg.innerText = '正在尋求公會認證...';
            msg.style.color = '#c084fc';

            const res = await fetch(`${API_URL}/activation_codes?code=eq.${code}&select=*`, { headers: apiHeaders });
            const data = await res.json();

            if (!data || data.length === 0) {
                msg.innerText = '❌ 查無此通關密語。';
                msg.style.color = '#f87171';
                return;
            }

            if (data[0].is_used) {
                msg.innerText = '❌ 此密語已被其他冒險者使用。';
                msg.style.color = '#f87171';
                return;
            }

            await fetch(`${API_URL}/activation_codes?code=eq.${code}`, {
                method: 'PATCH',
                headers: apiHeaders,
                body: JSON.stringify({ is_used: true, line_user_id: currentUserId, activated_at: new Date().toISOString() })
            });

            msg.innerText = '✨ 啟動成功！正在展開航海地圖...';
            msg.style.color = '#4ade80';

            setTimeout(() => {
                document.getElementById('activationSection').classList.add('hidden');
                document.getElementById('mapSection').classList.remove('hidden');
                loadMapData();
            }, 500);
        }

        async function loadMapData() {
            const [mRes, sRes, rRes] = await Promise.all([
                fetch(`${API_URL}/merchants?select=*&order=id.asc`, { headers: apiHeaders }),
                fetch(`${API_URL}/user_stamps?line_user_id=eq.${currentUserId}&select=merchant_id`, { headers: apiHeaders }),
                fetch(`${API_URL}/user_rewards?line_user_id=eq.${currentUserId}&reward_name=eq.${encodeURIComponent(REWARD_NAME)}&select=*`, { headers: apiHeaders })
            ]);

            merchantsList = await mRes.json();
            const stamps = await sRes.json();
            const rewards = await rRes.json();

            stampedSet = new Set((stamps || []).map(s => s.merchant_id));

            if (rewards && rewards.length > 0) {
                isRewardClaimed = true;
                rewardClaimedAt = new Date(rewards[0].claimed_at).toLocaleString();
            } else {
                isRewardClaimed = false;
                rewardClaimedAt = null;
            }

            const stampCount = stamps.length;
            const totalCount = merchantsList.length;
            const pBar = document.getElementById('progressBar');

            if (stampCount >= 3) {
                pBar.classList.add('reward-ready');
                if (isRewardClaimed) {
                    document.getElementById('stampCountText').innerHTML = `🌟 試煉達成！獎品已兌換領取`;
                    document.getElementById('stampSubText').innerHTML = `✦ 已於 ${rewardClaimedAt} 完成實體檔案夾核銷 ✦`;
                } else {
                    document.getElementById('stampCountText').innerHTML = `🎉 試煉達成！已集滿 ${stampCount} / ${totalCount} 間據點`;
                    document.getElementById('stampSubText').innerHTML = `🎁 點此出示領取【公會專屬檔案夾】特權獎勵 ❯`;
                    
                    const hasShownModal = sessionStorage.getItem('reward_shown_' + currentUserId);
                    if (!hasShownModal) {
                        showRewardModal();
                        sessionStorage.setItem('reward_shown_' + currentUserId, 'true');
                    }
                }
            } else {
                pBar.classList.remove('reward-ready');
                document.getElementById('stampCountText').innerText = `探索進度：已集點 ${stampCount} / ${totalCount} 間據點`;
                document.getElementById('stampSubText').innerText = `✦ 集滿 3 間據點即可解鎖「公會專屬檔案夾」✦`;
            }

            if (!selectedMerchantId && merchantsList.length > 0) {
                selectedMerchantId = merchantsList[0].id;
            }

            renderMapNodes();
            renderSelectedDetail();
            updateRewardModalUI();
        }

        function renderMapNodes() {
            const container = document.getElementById('nodesContainer');
            container.innerHTML = '';

            merchantsList.forEach((m, idx) => {
                const pos = NODE_POSITIONS[idx] || { x: 30 + idx * 25, y: 30 + idx * 20 };
                const isStamped = stampedSet.has(m.id);
                const isSelected = m.id === selectedMerchantId;

                const nodeEl = document.createElement('div');
                nodeEl.className = `map-node ${isStamped ? 'stamped' : ''} ${isSelected ? 'active' : ''}`;
                nodeEl.style.left = `${pos.x}%`;
                nodeEl.style.top = `${pos.y}%`;
                nodeEl.onclick = () => selectMerchant(m.id);

                nodeEl.innerHTML = `
                    <div class="node-pin">${isStamped ? '✓' : (idx + 1)}</div>
                    <div class="node-label">${m.name}</div>
                `;
                container.appendChild(nodeEl);
            });
        }

        function selectMerchant(id) {
            selectedMerchantId = id;
            renderMapNodes();
            renderSelectedDetail();
        }

        function renderSelectedDetail() {
            const m = merchantsList.find(item => item.id === selectedMerchantId);
            if (!m) return;

            const isStamped = stampedSet.has(m.id);
            const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m.address)}`;
            const detailContainer = document.getElementById('detailContent');

            detailContainer.innerHTML = `
                <h3 class="detail-name">${m.name}</h3>
                <div class="detail-discount">📜 特權優惠：${m.discount_info}</div>
                <div class="detail-address">📍 據點地址：${m.address}</div>
                
                <a href="${navUrl}" target="_blank" class="btn-navigation">
                    🧭 開啟 Google Maps 實境導航
                </a>

                ${isStamped 
                    ? `<div class="stamped-banner">✦ 已完成集點 ‧ 印記已點亮 ✦</div>`
                    : `
                        <div class="verify-group">
                            <input type="password" id="currentPinInput" class="pin-input" placeholder="店員 PIN 碼" maxlength="6">
                            <button onclick="verifyCurrentStore('${m.pin_code}')" class="btn-verify">現場核銷</button>
                        </div>
                        <div id="verifyMsg" style="margin-top:8px; font-size:13px; font-weight:bold; text-align:center;"></div>
                    `
                }
            `;
        }

        async function verifyCurrentStore(correctPin) {
            const input = document.getElementById('currentPinInput').value.trim();
            const msg = document.getElementById('verifyMsg');

            if (input !== correctPin) {
                msg.innerText = '❌ 核銷密碼錯誤！';
                msg.style.color = '#f87171';
                return;
            }

            const res = await fetch(`${API_URL}/user_stamps`, {
                method: 'POST',
                headers: apiHeaders,
                body: JSON.stringify({ line_user_id: currentUserId, merchant_id: selectedMerchantId })
            });

            if (!res.ok) {
                msg.innerText = '⚠️ 本店已完成集點！';
                msg.style.color = '#fbbf24';
                return;
            }

            msg.innerText = '✨ 核銷成功，地圖印記已點亮！';
            msg.style.color = '#4ade80';
            setTimeout(() => loadMapData(), 500);
        }

        // 獎勵彈窗控制
        function showRewardModal() {
            updateRewardModalUI();
            document.getElementById('rewardModal').classList.remove('hidden');
        }

        function closeRewardModal() {
            document.getElementById('rewardModal').classList.add('hidden');
        }

        function checkAndOpenReward() {
            if (stampedSet.size >= 3) {
                showRewardModal();
            }
        }

        function updateRewardModalUI() {
            const area = document.getElementById('rewardActionArea');
            if (isRewardClaimed) {
                area.innerHTML = `
                    <div style="background:rgba(34,197,94,0.18); border:2px dashed #4ade80; color:#4ade80; padding:12px; border-radius:8px; font-weight:bold; font-size:15px; margin-bottom:8px;">
                        ✅ 已完成實體核銷兌換<br>
                        <span style="font-size:12px; color:#cbd5e1;">核銷時間：${rewardClaimedAt}</span>
                    </div>
                `;
            } else {
                area.innerHTML = `
                    <div style="margin-top:8px;">
                        <input type="password" id="staffRewardPin" class="pin-input" style="width:100%; margin-bottom:8px; font-size:16px; text-align:center;" placeholder="請工作人員輸入核銷 PIN 碼" maxlength="6">
                        <button class="btn-claim" id="btnClaimReward" onclick="claimRewardStaff()">工作人員確認核銷</button>
                        <div id="rewardClaimMsg" style="font-size:13px; margin-top:6px; font-weight:bold; text-align:center;"></div>
                    </div>
                `;
            }
        }

        // 工作人員現場輸入 PIN 碼核銷
        async function claimRewardStaff() {
            const pinInput = document.getElementById('staffRewardPin').value.trim();
            const msg = document.getElementById('rewardClaimMsg');

            if (!pinInput) {
                msg.innerText = '請輸入工作人員核銷碼';
                msg.style.color = '#f87171';
                return;
            }

            if (pinInput !== REWARD_STAFF_PIN) {
                msg.innerText = '❌ 工作人員核銷密碼錯誤！';
                msg.style.color = '#f87171';
                return;
            }

            const btn = document.getElementById('btnClaimReward');
            btn.disabled = true;
            btn.innerText = '正在寫入公會兌換名冊...';

            try {
                const res = await fetch(`${API_URL}/user_rewards`, {
                    method: 'POST',
                    headers: apiHeaders,
                    body: JSON.stringify({
                        line_user_id: currentUserId,
                        reward_name: REWARD_NAME
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    if (err.code === '23505') {
                        alert('⚠️ 此冒險者先前已完成核銷領取，不可重複領取！');
                    } else {
                        throw new Error('伺服器記錄失敗');
                    }
                    loadMapData();
                    return;
                }

                alert('🎉 核銷成功！已交付獎品並記錄於後台數據庫。');
                loadMapData();
            } catch (e) {
                msg.innerText = '❌ 核銷失敗：' + e.message;
                msg.style.color = '#f87171';
                btn.disabled = false;
                btn.innerText = '工作人員確認核銷';
            }
        }

        // 重新測試按鈕
        function resetTestState() {
            if (confirm('確定要重設測試狀態，重新體驗輸入通關密語嗎？')) {
                localStorage.removeItem('gandalf_liff_uid');
                sessionStorage.clear();
                location.reload();
            }
        }

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
