<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桿道夫《魔法地圖》</title>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Google 古典魔法風格字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --parchment-bg: #f4ecd8;
            --parchment-border: #8b5a2b;
            --ink-dark: #2b1810;
            --ink-red: #8b1e1e;
            --ink-gold: #b38b2d;
        }

        body {
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            background-color: #1e130c;
            /* 羊皮紙底紋紋理效果 */
            background-image: 
                radial-gradient(circle, rgba(244,236,216,0.92) 0%, rgba(226,206,166,0.95) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 4px);
            color: var(--ink-dark);
            margin: 0;
            padding: 16px 12px;
        }

        .map-container {
            max-width: 460px;
            margin: auto;
            border: 4px double var(--parchment-border);
            padding: 16px;
            background: rgba(249, 243, 229, 0.7);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4), inset 0 0 30px rgba(139, 90, 43, 0.15);
        }

        /* 標題與羊皮紙裝飾 */
        .map-header {
            text-align: center;
            border-bottom: 2px dashed var(--parchment-border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .map-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--ink-red);
            margin: 4px 0;
            font-weight: 800;
        }
        .map-subtitle {
            font-size: 13px;
            letter-spacing: 1px;
            color: #5c3a21;
        }

        /* 卡片設計：手繪地圖據點卷軸風格 */
        .spot-card {
            background: #fbf7ee;
            border: 2px solid #caa472;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 16px;
            position: relative;
            box-shadow: 2px 2px 6px rgba(43,24,16,0.1);
        }
        .spot-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink-dark);
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .spot-desc {
            font-size: 14px;
            color: var(--ink-red);
            font-weight: 700;
            margin: 6px 0;
            padding: 4px 8px;
            background: rgba(139, 30, 30, 0.06);
            border-left: 3px solid var(--ink-red);
        }
        .spot-address {
            font-size: 13px;
            color: #634832;
            margin: 6px 0;
        }

        /* 導航按鈕 */
        .btn-nav {
            display: inline-block;
            background: #dfcba5;
            color: var(--ink-dark);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--parchment-border);
            margin-top: 4px;
            transition: 0.2s;
        }
        .btn-nav:hover {
            background: #caa472;
        }

        /* 核銷區塊 */
        .verify-box {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #d9c29e;
        }
        input.pin-input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            background: #fff9ed;
            border: 1px solid var(--parchment-border);
            font-size: 14px;
            color: var(--ink-dark);
            border-radius: 4px;
            margin-bottom: 6px;
        }
        button.btn-verify {
            width: 100%;
            background: var(--ink-red);
            color: #fbf7ee;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
        }
        button.btn-verify:hover {
            background: #6e1515;
        }

        /* 封蠟章集點完成特效 */
        .wax-stamp {
            display: inline-block;
            color: #991b1b;
            border: 3px double #991b1b;
            padding: 4px 12px;
            font-weight: 800;
            font-size: 15px;
            border-radius: 8px;
            transform: rotate(-6deg);
            background: rgba(254, 226, 226, 0.4);
            box-shadow: 0 0 4px rgba(153, 27, 27, 0.3);
            letter-spacing: 2px;
            margin-top: 6px;
        }

        /* 進度條 */
        .progress-box {
            background: #efe3ca;
            border: 1px solid var(--parchment-border);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            text-align: center;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="map-container">
        <!-- 地圖卷軸標題 -->
        <div class="map-header">
            <div class="map-subtitle">公會冒險任務 ‧ 探索城市據點</div>
            <div class="map-title">✨ 桿道夫魔法地圖 ✨</div>
            <div style="font-size: 11px; color: #785338;">I SOLEMNLY SWEAR THAT I AM UP TO NO GOOD</div>
        </div>

        <!-- 讀取狀態 -->
        <div id="loading" style="text-align:center; padding: 20px; font-weight:bold;">
            正在展開羊皮紙魔法卷軸...
        </div>

        <!-- 步驟 1：輸入啟用碼 -->
        <div id="activationSection" class="hidden">
            <div class="spot-card" style="text-align: center;">
                <h3 style="margin-top:0; color:var(--ink-red);">解鎖魔法探索地圖</h3>
                <p style="font-size: 13px; color:#5c3a21;">請輸入聯票專屬之 6 碼通關密語：</p>
                <input type="text" id="activationInput" class="pin-input" placeholder="例：TEST01" style="text-align:center; font-size:16px; letter-spacing:2px;" />
                <button onclick="handleActivation()" class="btn-verify" style="margin-top:6px;">開啟探索特權</button>
                <div id="activationMsg" style="margin-top:8px; font-size:13px; font-weight:bold;"></div>
            </div>
        </div>

        <!-- 步驟 2：店家地圖與集點進度 -->
        <div id="mapSection" class="hidden">
            <!-- 進度追蹤 -->
            <div class="progress-box">
                <span id="stampCountText">探索進度：已蒐集 0 / 3 個魔法印記</span>
                <div style="font-size:11px; color:#6e4b2d; margin-top:2px;">滿 3 家即可於場館領取「初階試煉者：公會檔案夾」</div>
            </div>

            <!-- 店家列表 -->
            <div id="merchantContainer"></div>
        </div>
    </div>

    <script>
        const LIFF_ID = '2012258408-yrd0t2GN';
        const API_URL = 'https://wsphfkvqquztearorpkd.supabase.co/rest/v1';
        const API_KEY = 'sb_publishable_B9mdwTlyqRCRMPRK4o2Enw_eiUY5vU-';

        const apiHeaders = {
            'apikey': API_KEY,
            'Authorization': 'Bearer ' + API_KEY,
            'Content-Type': 'application/json'
        };

        let currentUserId = null;

        async function initApp() {
            try {
                if (window.liff) {
                    try {
                        await Promise.race([
                            liff.init({ liffId: LIFF_ID }),
                            new Promise((_, reject) => setTimeout(() => reject('timeout'), 2500))
                        ]);
                        if (liff.isLoggedIn()) {
                            const profile = await liff.getProfile();
                            currentUserId = profile.userId;
                        } else if (liff.isInClient()) {
                            liff.login();
                            return;
                        }
                    } catch (e) {}
                }

                if (!currentUserId) {
                    let savedId = localStorage.getItem('gandalf_uid');
                    if (!savedId) {
                        savedId = 'MAGE_' + Math.floor(1000 + Math.random() * 9000);
                        localStorage.setItem('gandalf_uid', savedId);
                    }
                    currentUserId = savedId;
                }

                await checkStatus();
            } catch (err) {
                document.getElementById('loading').innerText = '魔法地圖展開失敗，請重新載入。';
            }
        }

        async function checkStatus() {
            const checkRes = await fetch(`${API_URL}/activation_codes?line_user_id=eq.${currentUserId}&select=*`, {
                headers: apiHeaders
            });
            const activatedList = await checkRes.json();
            document.getElementById('loading').classList.add('hidden');

            if (activatedList && activatedList.length > 0 && activatedList[0].is_used) {
                document.getElementById('mapSection').classList.remove('hidden');
                loadMerchants();
            } else {
                document.getElementById('activationSection').classList.remove('hidden');
            }
        }

        async function handleActivation() {
            const code = document.getElementById('activationInput').value.trim().toUpperCase();
            const msg = document.getElementById('activationMsg');
            if (!code) return;

            msg.innerText = '正在尋求公會認證...';
            msg.style.color = '#785338';

            const res = await fetch(`${API_URL}/activation_codes?code=eq.${code}&select=*`, { headers: apiHeaders });
            const data = await res.json();

            if (!data || data.length === 0) {
                msg.innerText = '❌ 查無此通關密語。';
                msg.style.color = '#8b1e1e';
                return;
            }

            if (data[0].is_used) {
                msg.innerText = '❌ 此密語已被其他冒險者綁定。';
                msg.style.color = '#8b1e1e';
                return;
            }

            await fetch(`${API_URL}/activation_codes?code=eq.${code}`, {
                method: 'PATCH',
                headers: apiHeaders,
                body: JSON.stringify({ is_used: true, line_user_id: currentUserId, activated_at: new Date().toISOString() })
            });

            msg.innerText = '✨ 啟動成功！正在繪製探索據點...';
            msg.style.color = '#2d6a4f';

            setTimeout(() => {
                document.getElementById('activationSection').classList.add('hidden');
                document.getElementById('mapSection').classList.remove('hidden');
                loadMerchants();
            }, 600);
        }

        async function loadMerchants() {
            const container = document.getElementById('merchantContainer');
            container.innerHTML = '<p style="text-align:center; color:#785338;">探索據點繪製中...</p>';

            const [mRes, sRes] = await Promise.all([
                fetch(`${API_URL}/merchants?select=*&order=id.asc`, { headers: apiHeaders }),
                fetch(`${API_URL}/user_stamps?line_user_id=eq.${currentUserId}&select=merchant_id`, { headers: apiHeaders })
            ]);

            const merchants = await mRes.json();
            const stamps = await sRes.json();
            const stampedSet = new Set((stamps || []).map(s => s.merchant_id));

            // 更新印記進度
            document.getElementById('stampCountText').innerText = `探索進度：已蒐集 ${stamps.length} / ${merchants.length} 個魔法印記`;

            container.innerHTML = '';

            merchants.forEach((m, idx) => {
                const isStamped = stampedSet.has(m.id);
                const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m.address)}`;

                const item = document.createElement('div');
                item.className = 'spot-card';
                item.innerHTML = `
                    <div class="spot-name">
                        <span>🏰 据點 ${idx + 1}：${m.name}</span>
                    </div>
                    <div class="spot-desc">📜 專屬特權：${m.discount_info}</div>
                    <div class="spot-address">📍 地址：${m.address}</div>
                    <a href="${navUrl}" target="_blank" class="btn-nav">🧭 開啟 Google Maps 導航</a>

                    ${isStamped 
                        ? `<div style="text-align:right;"><div class="wax-stamp">✦ 已完成集點 ✦</div></div>`
                        : `
                            <div class="verify-box">
                                <input type="password" id="pin_${m.id}" class="pin-input" placeholder="現場店員輸入 4 碼核銷密碼" maxlength="6">
                                <button onclick="verifyStorePin(${m.id}, '${m.pin_code}')" class="btn-verify">現場核銷 ‧ 蓋上印記</button>
                                <div id="stampMsg_${m.id}" style="margin-top:6px; font-size:13px; font-weight:bold;"></div>
                            </div>
                        `
                    }
                `;
                container.appendChild(item);
            });
        }

        async function verifyStorePin(merchantId, correctPin) {
            const input = document.getElementById(`pin_${merchantId}`).value.trim();
            const msg = document.getElementById(`stampMsg_${merchantId}`);

            if (input !== correctPin) {
                msg.innerText = '❌ 核銷密碼錯誤！';
                msg.style.color = '#8b1e1e';
                return;
            }

            const res = await fetch(`${API_URL}/user_stamps`, {
                method: 'POST',
                headers: apiHeaders,
                body: JSON.stringify({ line_user_id: currentUserId, merchant_id: merchantId })
            });

            if (!res.ok) {
                msg.innerText = '⚠️ 本據點已蓋印完成！';
                msg.style.color = '#8b1e1e';
                return;
            }

            msg.innerText = '✨ 核銷完成，魔法印記已點亮！';
            msg.style.color = '#2d6a4f';
            setTimeout(() => loadMerchants(), 600);
        }

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
